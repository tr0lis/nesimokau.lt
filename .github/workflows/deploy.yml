name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish Blazor
        run: dotnet publish ./nesimokau.lt.csproj -c Release -o ./publish

      - name: Copy static site to public/
        run: |
          rm -rf public
          mkdir public
          cp -r publish/wwwroot/. public/

      - name: Generate SEO-rendered public routes
        run: node scripts/generate-seo.mjs public

      - name: Install dependencies
        run: npm ci

      # Not --prebuilt: prebuilt deploys only get env vars from `vercel pull`, which omits
      # Sensitive variables. A normal deploy lets Vercel attach all project env vars at runtime.
      - name: Vercel deploy
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify production API
        run: |
          response=$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --location https://nesimokau.lt/api/auth/me)
          echo "$response" | node -e "let body=''; process.stdin.on('data', chunk => body += chunk); process.stdin.on('end', () => { const result = JSON.parse(body); if (result.authenticated !== false) process.exit(1); });"
