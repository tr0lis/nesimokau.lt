name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish Blazor
        run: dotnet publish ./nesimokau.lt.csproj -c Release -o ./publish

      - name: Copy static site to public/
        run: |
          rm -rf public
          mkdir public
          cp -r publish/wwwroot/. public/

      - name: Generate SEO-rendered public routes
        run: node scripts/generate-seo.mjs public

      - name: Install dependencies
        run: npm ci

      - name: Vercel pull / build / deploy
        run: |
          npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
